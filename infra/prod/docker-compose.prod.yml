services:
  postgres:
    image: postgres:16-alpine
    container_name: video-app-postgres
    restart: unless-stopped
    # No public port mapping — only reachable from other containers on
    # video-app-network. Use `docker compose exec postgres psql ...` for
    # direct access instead of exposing 5432 to the host/internet.
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - video-app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: video-app-redis
    restart: unless-stopped
    # No public port mapping — internal network only.
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - video-app-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: video-app-server
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - video-app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: video-app-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - video-app-network
    depends_on:
      - server

networks:
  video-app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local
