services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: video-app-postgres
    restart: unless-stopped
    # No public port mapping — only reachable from other containers on
    # video-app-network. Use `docker compose exec postgres psql ...` for
    # direct access instead of exposing 5432 to the host/internet.
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - video-app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: video-app-redis
    restart: unless-stopped
    # No public port mapping — internal network only.
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - video-app-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: video-app-server
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - video-app-network
      - infra_default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  video-app-network:
    driver: bridge
  # Shared with the SAP Finance stack's Caddy instance (infra/docker-compose.yml
  # in the SAP_Finance repo), which reverse-proxies content-shelf.stackeylabs.com
  # to this container as `server:8000`. Must already exist on the host.
  infra_default:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
